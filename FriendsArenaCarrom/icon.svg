<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="boardGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5deb3"/>
      <stop offset="100%" stop-color="#d2b48c"/>
    </radialGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a2d0c"/>
      <stop offset="100%" stop-color="#2c1404"/>
    </linearGradient>
  </defs>
  <!-- Frame -->
  <rect width="512" height="512" rx="36" fill="url(#frameGrad)"/>
  <!-- Board Surface -->
  <rect x="36" y="36" width="440" height="440" rx="16" fill="url(#boardGrad)"/>
  <!-- Corner Pockets -->
  <circle cx="72" cy="72" r="32" fill="#111111"/>
  <circle cx="440" cy="72" r="32" fill="#111111"/>
  <circle cx="72" cy="440" r="32" fill="#111111"/>
  <circle cx="440" cy="440" r="32" fill="#111111"/>
  <!-- Center circle -->
  <circle cx="256" cy="256" r="64" fill="none" stroke="#8b4513" stroke-width="6"/>
  <circle cx="256" cy="256" r="24" fill="none" stroke="#8b4513" stroke-width="4"/>
  <!-- Queen in center -->
  <circle cx="256" cy="256" r="18" fill="#e53935" stroke="#b71c1c" stroke-width="3"/>
  <!-- Striker on baseline -->
  <circle cx="256" cy="380" r="28" fill="#fdfbf7" stroke="#ffd700" stroke-width="5"/>
  <circle cx="256" cy="380" r="8" fill="#1e88e5"/>
</svg>
